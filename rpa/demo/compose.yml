name: kairos-servlet-demo
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: kairos_servlet_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Defina DEMO_DB_PASSWORD}
      RPA_EMAIL: ${RPA_EMAIL:?Defina RPA_EMAIL}
      RPA_PASSWORD: ${RPA_PASSWORD:?Defina RPA_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - demo-data:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/01-demo.sh:ro
      - ./schema.sql:/demo/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d kairos_servlet_demo"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build:
      context: ../..
      dockerfile: rpa/demo/Dockerfile
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://db:5432/kairos_servlet_demo
      DB_USER: demo
      DB_PASSWORD: ${DEMO_DB_PASSWORD:?Defina DEMO_DB_PASSWORD}
      KAIROS_RPA_DEMO: "true"
    depends_on:
      db:
        condition: service_healthy
volumes:
  demo-data:
